name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# The actions are pinned to full commit SHAs (the tag in the comment); .github/dependabot.yml
# proposes updates. The apt packages, the runner image and the Python patch release float.

jobs:
  cpp-x86_64:
    # x86-64 with AVX2 + FMA: the SIMD distance path (-mavx2 -mfma).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CPPZMQ_VERSION: "4.10.0"
      CPPZMQ_SHA256: "1f8b641161dcf12641ae4951c2c49552de425be88d66c988ec5e85046f1320f6"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libzmq3-dev
          curl -fsSL -o zmq.hpp "https://raw.githubusercontent.com/zeromq/cppzmq/v${CPPZMQ_VERSION}/zmq.hpp"
          echo "${CPPZMQ_SHA256}  zmq.hpp" | sha256sum -c -
          sudo install -m 0644 zmq.hpp /usr/local/include/zmq.hpp
      - name: Configure (Release is the default build type)
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600

  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install numpy==1.25.0 scipy==1.11.4 pymetis==2023.1.1 pyzmq==25.1.2
      - name: Unit tests
        run: python -m unittest discover -s tools -t . -v
